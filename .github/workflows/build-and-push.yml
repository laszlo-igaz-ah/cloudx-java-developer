on: [push, workflow_dispatch]
name: Build and Push Docker image

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      registry_login_server: ${{ steps.set-registry-login-server.outputs.value }}
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@main
      - name: 'Login via Azure CLI'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: 'Docker Login'
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set registry login server output
        id: set-registry-login-server
        run: echo "value=${{ secrets.REGISTRY_LOGIN_SERVER }}" >> $GITHUB_OUTPUT

  build-petstoreapp:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Build and push PetStore APP image
        working-directory: ./petstoreapp
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreapp:build-${{ github.job }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreapp:build-${{ github.job }}

  build-petstoreorderservice:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Build and push PetStore OrderService image
        working-directory: ./petstoreorderservice
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreorderservice:build-${{ github.job }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreorderservice:build-${{ github.job }}

  build-petstorepetservice:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Build and push PetStore PetService image
        working-directory: ./petstorepetservice
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstorepetservice:build-${{ github.job }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstorepetservice:build-${{ github.job }}

  build-petstoreproductservice:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - name: Build and push PetStore ProductService image
        working-directory: ./petstoreproductservice
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreproductservice:build-${{ github.job }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/petstoreproductservice:build-${{ github.job }}
