spring:
  application:
    name: petstorepetservice
  cloud:
    azure:
      cosmos:
        endpoint: ${COSMOS_ENDPOINT:}
        key: ${COSMOS_KEY:}
        database: ${COSMOS_DATABASE:igazl-cloudx-petstore}
        populate-query-metrics: false
server:
  port: ${PETSTOREPETSERVICE_SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    ssl:
      enabled: false
    diskspace:
      enabled: false

